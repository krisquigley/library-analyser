[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-analyzer"
version = "0.1.0"
description = "Local music analyser: partial Phase 1 environment foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
music-analyzer = "music_analyzer.frameworks.cli.main:main"

[tool.setuptools.packages.find]
include = ["music_analyzer*"]
