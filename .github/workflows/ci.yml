name: CLI foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ffmpeg:
        description: Require existing runner FFmpeg for optional decode tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-build-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - name: Dependency-free unit and boundary tests
        run: |
          python -m unittest discover -s tests/unit -v
          python -m unittest tests.architecture.test_import_boundaries -v
      - name: Isolated mandatory real SQLite empirical qualification (hard120s)
        id: empirical
        shell: bash
        run: |
          mkdir -p empirical-artifacts
          log=empirical-artifacts/real-sqlite.log
          echo 'command: setsid timeout --signal=KILL 120s python -u - (strict single-test runner)' > "$log"
          set +e
          setsid timeout --signal=KILL 120s python -u - >> "$log" 2>&1 <<'PY'
          import os
          import platform
          import sys
          import unittest
          selector = ('tests.integration.infrastructure.test_integrity_d2_evidence_admission.'
                      'IntegrityD2EvidenceAdmission.'
                      'test_blob_bom_decoded_domain_and_separate_runtime_bound')
          print(f'python={platform.python_version()} selector={selector}', flush=True)
          if platform.python_version() != '3.14.8':
              sys.exit('Required empirical interpreter is Python3.14.8')
          if os.environ.get('CI_EMPIRICAL_ALREADY_PASSED') == '1':
              sys.exit('Dedicated empirical execution must not be skipped')
          suite = unittest.defaultTestLoader.loadTestsFromName(selector)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (result.testsRun == 1 and not result.skipped and result.wasSuccessful())
          print(f'tests={result.testsRun} skips={len(result.skipped)} '
                f'failures={len(result.failures)} errors={len(result.errors)} '
                f'exit={0 if passed else 1}', flush=True)
          sys.exit(0 if passed else 1)
          PY
          rc=$?
          echo "supervisor_exit=$rc" >> "$log"
          cat "$log"
          exit "$rc"
      - name: Preserve empirical command, count and exit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-sqlite-empirical-${{ github.event_name }}-${{ github.sha }}
          path: empirical-artifacts/real-sqlite.log
          if-no-files-found: error
      - name: Adapter and CLI suite (real decode explicitly disabled)
        env:
          RUN_FFMPEG_TESTS: "0"
          RUN_PACKAGING_TESTS: "0"
          # This step runs only after the strict dedicated empirical step succeeds.
          CI_EMPIRICAL_ALREADY_PASSED: "1"
        run: python -m unittest discover -v
      - name: Build tooling only (not an inference environment)
        run: python -m pip install setuptools==84.0.0
  ffmpeg-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.8"
      - name: Require runner-provided FFmpeg (no silent successful skip)
        run: ffmpeg -version
      - name: Disposable format decode integration, not inference
        env:
          RUN_FFMPEG_TESTS: "1"
        run: python -m unittest tests.integration.infrastructure.test_audio_decode -v
