name: CLI foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ffmpeg:
        description: Require existing runner FFmpeg for optional decode tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-build-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Dependency-free unit and boundary tests
        run: |
          python -m unittest discover -s tests/unit -v
          python -m unittest tests.architecture.test_import_boundaries -v
      - name: Adapter and CLI suite (real decode explicitly disabled)
        env:
          RUN_FFMPEG_TESTS: '0'
          RUN_PACKAGING_TESTS: '0'
        run: python -m unittest discover -v
      - name: Build tooling only (not an inference environment)
        run: python -m pip install setuptools==84.0.0
      - name: Offline sdist, wheel and isolated installation acceptance
        env:
          RUN_PACKAGING_TESTS: '1'
        run: python -m unittest tests.packaging.test_distribution -v
  ffmpeg-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Require runner-provided FFmpeg (no silent successful skip)
        run: ffmpeg -version
      - name: Disposable format decode integration, not inference
        env:
          RUN_FFMPEG_TESTS: '1'
        run: python -m unittest tests.integration.infrastructure.test_audio_decode -v
